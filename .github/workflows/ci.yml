# Runs the same checks as a local `npm run check && npm run build && npm audit` on every pull
# request and on every push to preview and main (main is what gets hosted). Also checks that main
# only takes pull requests from preview (D-034). See CLAUDE.md and docs/security.md.
name: CI

on:
  pull_request:
  push:
    branches: [main, preview]

# Least privilege: the job only reads the code. Nothing here can push, comment or deploy.
permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs (the tag is in the comment) so a moved tag
      # can't change what runs here.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install exactly what the lockfile says
        run: npm ci

      - name: Run the checks (stats, reminders, seed, security, backup, schedules)
        run: npm run check

      - name: Build the site
        run: npm run build

      - name: Audit dependencies
        run: npm audit

  # main only takes pull requests from this repository's preview branch (D-034). GitHub's rules
  # can't name a source branch, so this job does, and the main ruleset requires it to pass.
  # Branch names come in through env, never pasted into the script, so a crafted name can't run.
  release-source:
    name: Release source
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Pull requests into main come from preview
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$BASE" = "main" ] && { [ "$HEAD" != "preview" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; }; then
            echo "::error::Pull requests into main must come from this repository's preview branch (D-034). Open this one into preview instead."
            exit 1
          fi
          echo "OK"
