# Runs the same checks as a local `npm run check && npm run build && npm audit` on every pull
# request and on every push to main (which is what gets hosted). See CLAUDE.md and docs/security.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job only reads the code. Nothing here can push, comment or deploy.
permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs (the tag is in the comment) so a moved tag
      # can't change what runs here.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install exactly what the lockfile says
        run: npm ci

      - name: Run the checks (stats, reminders, seed, security, backup, schedules)
        run: npm run check

      - name: Build the site
        run: npm run build

      - name: Audit dependencies
        run: npm audit
